[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-to-cut-milp"
version = "0.2.0"
description = "Learning-guided selection of provably valid cover cuts for transparent MILP experiments"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "PolyForm Noncommercial 1.0.0"}
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
